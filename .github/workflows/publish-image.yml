name: Publish Image

on:
  push:
    branches:
      - main
      - codex/remind-web-app
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.7'
          cache: true

      - name: Test application
        run: |
          go vet ./...
          go test -race ./...

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/joekleinsorge/remind
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Package Freshlab deployment
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          bash scripts/package-deployment.sh "$IMAGE_DIGEST" freshlab
          echo '### Freshlab image' >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/joekleinsorge/remind@$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deployment bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: freshlab-remind
          path: freshlab/
