name: Publish Image

on:
  push:
    branches:
      - main
      - codex/remind-web-app
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'
          cache: true

      - name: Test application
        run: |
          go vet ./...
          go test -race ./...

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/joekleinsorge/remind
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Package Freshlab deployment
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          bash scripts/package-deployment.sh "$IMAGE_DIGEST" freshlab
          echo '### Freshlab image' >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/joekleinsorge/remind@$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deployment bundle
        uses: actions/upload-artifact@v4
        with:
          name: freshlab-remind
          path: freshlab/
