name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: test -z "$(gofmt -l .)"

      - name: Verify modules
        run: go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test -race ./...

      - name: Build
        run: go build ./...

      - name: Verify operations tooling
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          node --check web/app.js
          kubectl kustomize k8s > /dev/null
          kubectl kustomize k8s/external-secrets > /dev/null
          kubectl kustomize deploy/external-secrets > /dev/null
          bundle_dir=$(mktemp -d)
          bash scripts/package-deployment.sh "sha256:$(printf '1%.0s' {1..64})" "$bundle_dir"
          test -s "$bundle_dir/remind-rendered.yaml"

      - name: Build container
        run: docker build -t remind:test .
