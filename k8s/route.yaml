apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: remind
  namespace: remind
  annotations:
    external-dns.kubernetes.io/hostname: remind.kleinsorge.dev
    external-dns.alpha.kubernetes.io/hostname: remind.kleinsorge.dev
spec:
  parentRefs:
    - {group: gateway.networking.k8s.io, kind: Gateway, name: freshlab, namespace: istio-system, sectionName: https}
  hostnames: [remind.kleinsorge.dev]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - {group: "", kind: Service, name: remind, port: 80, weight: 1}
