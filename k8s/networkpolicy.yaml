apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: remind-ingress
  namespace: remind
spec:
  podSelector:
    matchLabels: {app: remind}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - {protocol: TCP, port: 4180}
