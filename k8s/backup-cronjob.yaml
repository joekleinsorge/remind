apiVersion: batch/v1
kind: CronJob
metadata:
  name: remind-state-backup
  namespace: remind
spec:
  schedule: "30 5 * * *"
  timeZone: America/New_York
  startingDeadlineSeconds: 1800
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  suspend: true
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: alpine:3.20
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  if [ ! -s /data/remind-state.json ]; then
                    echo "No reminder state exists yet; skipping backup."
                    exit 0
                  fi
                  mkdir -p /data/backups
                  cp /data/remind-state.json "/data/backups/remind-state-$(date -u +%Y%m%dT%H%M%SZ).json"
                  find /data/backups -type f -name 'remind-state-*.json' -mtime +30 -delete
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: data
                  mountPath: /data
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: remind-data
